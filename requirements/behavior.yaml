  "sentences": [
    {
      "id": "D1-001",
      "sentence": "Within the bounded NGPL assessment, identify a notice version by pipeline, notice ID and source-content hash.",
      "spec_line": 19
    },
    {
      "id": "D1-002",
      "sentence": "Identify an event by pipeline and the root notice ID of its complete, acyclic, explicit prior-notice chain.",
      "spec_line": 20
    },
    {
      "id": "D1-003",
      "sentence": "Do not infer identity from ID order, subject or text similarity.",
      "spec_line": 21
    },
    {
      "id": "D1-004",
      "sentence": "An incomplete chain or disputed cross-chain identity blocks automatic alerting, but not retention of the input or an explicitly uncertain candidate for review; retain any human-approved correlation and its evidence.",
      "spec_line": 22
    },
    {
      "id": "D1-005",
      "sentence": "Initial alerts per resolved event must not exceed PARAM-INITIAL-001.",
      "spec_line": 23
    },
    {
      "id": "D1-006",
      "sentence": "Identify a material update by that event and its distinct source notice version.",
      "spec_line": 24
    },
    {
      "id": "D1-007",
      "sentence": "Identical replay or same-source re-extraction must not create another alert revision.",
      "spec_line": 25
    },
    {
      "id": "D1-008",
      "sentence": "Persist each alert key, decision reference, delivery attempt and acknowledgement across restarts.",
      "spec_line": 26
    },
    {
      "id": "D1-009",
      "sentence": "Retry with the same key; unconfirmed delivery stays uncertain.",
      "spec_line": 27
    },
    {
      "id": "D1-010",
      "sentence": "Require receiver idempotency before claiming duplicate-free delivery.",
      "spec_line": 28
    },
    {
      "id": "D1-011",
      "sentence": "Retain this memory without automatic expiry throughout the assessment; production retention requires separate approval.",
      "spec_line": 29
    },
    {
      "id": "D2-001",
      "sentence": "Compare a revision to its explicit predecessor using source-grounded constraints, services/directions, restriction kind/value/unit, operational status, effective interval and operational assertions in the body.",
      "spec_line": 33
    },
    {
      "id": "D2-002",
      "sentence": "Ignore IDs, links, capture/scrape metadata and whitespace-only presentation changes for materiality.",
      "spec_line": 34
    },
    {
      "id": "D2-003",
      "sentence": "If operational facts are unchanged, classify the supersede as nonmaterial and issue no new alert.",
      "spec_line": 35
    },
    {
      "id": "D2-004",
      "sentence": "Other changes require a recorded MATERIAL, NONMATERIAL or UNRESOLVED decision under D6; a changed number alone is not a materiality threshold.",
      "spec_line": 36
    },
    {
      "id": "D2-005",
      "sentence": "If a resolved event has no prior initial-alert record or attempt, its first MATERIAL and actionable decision may create the initial alert under D1.",
      "spec_line": 37
    },
    {
      "id": "D2-006",
      "sentence": "If an initial-alert record exists, a qualifying material revision produces a linked update.",
      "spec_line": 38
    },
    {
      "id": "D2-007",
      "sentence": "An unacknowledged initial attempt reuses its existing key; replay must not create another initial alert.",
      "spec_line": 39
    },
    {
      "id": "D2-008",
      "sentence": "UNRESOLVED changes are REVIEW_REQUIRED.",
      "spec_line": 40
    },
    {
      "id": "D2-009",
      "sentence": "A lift/termination must compare the prior restriction; do not generalize one rule from the two labeled termination examples.",
      "spec_line": 41
    },
    {
      "id": "D2-010",
      "sentence": "For the bounded same-ID/different-source-content case, retain the conflicting capture as evidence, preserve the last accepted snapshot, and require review before changed content can authorize alerting.",
      "spec_line": 42
    },
    {
      "id": "D2-011",
      "sentence": "Do not automatically overwrite, merge, discard or reconcile the conflict.",
      "spec_line": 43
    },
    {
      "id": "D2-012",
      "sentence": "Automatic reconciliation remains outside the implemented storage scope; this specified refusal boundary does not establish a complete source-version service.",
      "spec_line": 44
    },
    {
      "id": "D3-001",
      "sentence": "Record source event/publication times with stated timezone, ingestion time, and an explicitly supplied timezone-aware UTC reference time for each decision.",
      "spec_line": 48
    },
    {
      "id": "D3-002",
      "sentence": "Ambiguous time meaning remains unknown; do not substitute the machine/model clock.",
      "spec_line": 49
    },
    {
      "id": "D3-003",
      "sentence": "Missing ancestors, cycles or conflicting successor ordering defer alerting and retain the gap.",
      "spec_line": 50
    },
    {
      "id": "D3-004",
      "sentence": "When history arrives, create a new reconciliation decision following explicit prior links; retain the original uncertain decision.",
      "spec_line": 51
    },
    {
      "id": "D3-005",
      "sentence": "For the same accepted source versions, normalized facts, reference time and approved adjudications, the final event view must be order-independent.",
      "spec_line": 52
    },
    {
      "id": "D3-006",
      "sentence": "Do not expect independently regenerated stochastic model outputs to be identical.",
      "spec_line": 53
    },
    {
      "id": "D3-007",
      "sentence": "Actual delivery attempts remain historical and use D1 keys; final-view order independence does not imply identical real-time delivery histories.",
      "spec_line": 54
    },
    {
      "id": "D3-008",
      "sentence": "A restriction ending at or before the reference time is historical-only for a new disruption alert.",
      "spec_line": 55
    },
    {
      "id": "D3-009",
      "sentence": "Current or future intervals may be actionable after D6; assume no arbitrary age or advance-notice cutoff.",
      "spec_line": 56
    },
    {
      "id": "D3-010",
      "sentence": "Unknown time bounds and point changes such as a lift require a human actionability decision at that reference time.",
      "spec_line": 57
    },
    {
      "id": "D3-011",
      "sentence": "Historical label evaluation stays separate: never rescore it against today or treat it as permission for stale delivery.",
      "spec_line": 58
    },
    {
      "id": "D3-012",
      "sentence": "A source-grounded operational disruption may classify as SIGNAL_CANDIDATE even when its source timestamp timezone is unresolved. Unknown source timezone does not veto BR-FIRM classification; its candidate-only scope and all other evidence/history/refusal rules remain unchanged.",
      "spec_line": 59
    },
    {
      "id": "D3-013",
      "sentence": "Unresolved source timezone remains explicitly UNKNOWN and prohibits automatic current/future actionability and recommendation authorization; the actionability/authorization boundary returns REVIEW_REQUIRED even if a caller supplies authorization. recommendation_allowed remains false. The normalized time_basis value UNRESOLVED represents this unknown meaning; UTC fields for unzoned timestamps stay null and the actionability record explicitly reports source_timezone_status UNKNOWN.",
      "spec_line": 60
    },
    {
      "id": "D3-014",
      "sentence": "No NGPL timezone, UTC conversion, lateness cutoff or desk SLA is inferred.",
      "spec_line": 61
    },
    {
      "id": "D3-015",
      "sentence": "Where the source timestamp has an explicit trusted timezone, normal current/future/historical evaluation may proceed. Resolved historical-only intervals and clock-dependent revision/actionability decisions retain time precedence. Classification alone never grants materiality approval, recommendation authorization or delivery permission.",
      "spec_line": 62
    },
    {
      "id": "D4-001",
      "sentence": "Give every decision an immutable identity.",
      "spec_line": 66
    },
    {
      "id": "D4-002",
      "sentence": "Retrieve by that identity the exact input bytes/hash, extracted facts, prior versions and missing-history observations available then, reference/ingestion times, outcome/reasons, human adjudications, spec/rule/code/ dependency/model/prompt identities, relevant model execution evidence, and delivery key/attempt/acknowledgement when applicable.",
      "spec_line": 67
    },
    {
      "id": "D4-003",
      "sentence": "Later information and corrections create linked decisions without replacing their evidence or presenting later facts as known at an earlier decision.",
      "spec_line": 68
    },
    {
      "id": "D4-004",
      "sentence": "Preserve missing-history observations as missingness; do not backfill later facts into an old explanation.",
      "spec_line": 69
    },
    {
      "id": "D4-005",
      "sentence": "Retain failed/deferred decisions too.",
      "spec_line": 70
    },
    {
      "id": "D4-006",
      "sentence": "Do not automatically prune assessment records or retain credentials.",
      "spec_line": 71
    },
    {
      "id": "D4-007",
      "sentence": "Production retention or redaction needs separate approval.",
      "spec_line": 72
    },
    {
      "id": "D4-008",
      "sentence": "Current snapshot readback alone is not historical decision evidence.",
      "spec_line": 73
    },
    {
      "id": "D5-001",
      "sentence": "Empty, structurally invalid, contradictory or unsupported input must yield an explicit uncertain/error disposition, reason code and retained input evidence, not a successful negative classification or alert.",
      "spec_line": 77
    },
    {
      "id": "D5-002",
      "sentence": "Validation failure leaves the last valid snapshot unchanged.",
      "spec_line": 78
    },
    {
      "id": "D5-003",
      "sentence": "Invalid input or unresolved contradictions use UNKNOWN with a distinguishing reason; model/provider, environment and harness failures retain their separate existing classifications.",
      "spec_line": 79
    },
    {
      "id": "D5-004",
      "sentence": "Missing an optional strong-signal field alone is not malformed input.",
      "spec_line": 80
    },
    {
      "id": "D5-005",
      "sentence": "Conflicting identity, impossible quantities and incompatible operational assertions require correction/review, not fabricated facts.",
      "spec_line": 81
    },
    {
      "id": "D5-006",
      "sentence": "Unresolved timestamp meaning requires REVIEW_REQUIRED at the actionability/authorization boundary under D3. It does not by itself block a source-grounded firm-disruption candidate; malformed timestamps and other invalid evidence retain their existing refusal rules.",
      "spec_line": 82
    },
    {
      "id": "D5-007",
      "sentence": "A corrected execution is a new linked decision; retain the failed attempt.",
      "spec_line": 83
    },
    {
      "id": "D5-008",
      "sentence": "Classification is unscorable only where the necessary semantic result is unavailable.",
      "spec_line": 84
    },
    {
      "id": "D5-009",
      "sentence": "Structural, persistence, uncertainty and failure-handling requirements remain evaluable when their required observations exist.",
      "spec_line": 85
    },
    {
      "id": "D5-010",
      "sentence": "Application dispositions are distinct from harness PASS/FAIL/ERROR/UNKNOWN statuses and execution-domain classifications.",
      "spec_line": 86
    },
    {
      "id": "D5-011",
      "sentence": "A successful API response with an unusable verdict must not silently become a valid negative or small-impact decision.",
      "spec_line": 87
    },
    {
      "id": "D6-001",
      "sentence": "For new assessment cases outside the frozen label oracle, require a named human's recorded MATERIAL/NONMATERIAL/UNRESOLVED adjudication with cited source evidence.",
      "spec_line": 91
    },
    {
      "id": "D6-002",
      "sentence": "MATERIAL must identify a meaningful expected effect on gas flow or regional prices; NONMATERIAL must explain routine/administrative content or why a capacity change is minor.",
      "spec_line": 92
    },
    {
      "id": "D6-003",
      "sentence": "Unsupported judgement is UNRESOLVED and withholds an alert.",
      "spec_line": 93
    },
    {
      "id": "D6-004",
      "sentence": "Models may propose facts/reasons but may not approve this adjudication.",
      "spec_line": 94
    },
    {
      "id": "D6-005",
      "sentence": "Critical/unplanned status, planned material impact, segment, quantity and geography are evidence to weigh, not a mandatory all-fields checklist or numeric score cutoff.",
      "spec_line": 95
    },
    {
      "id": "D6-006",
      "sentence": "Extract stated values with units and meaning; absent values stay unknown.",
      "spec_line": 96
    },
    {
      "id": "D6-007",
      "sentence": "Do not convert scheduled-to MDQ percentages into absolute curtailed volume without the required source capacity/basis.",
      "spec_line": 97
    },
    {
      "id": "D6-008",
      "sentence": "Keep the fixed 14 labels as an evaluation oracle only.",
      "spec_line": 98
    },
    {
      "id": "D6-009",
      "sentence": "Labels do not authorize runtime alerts and must not be supplied as the implementation's answer to classification.",
      "spec_line": 99
    },
    {
      "id": "D6-010",
      "sentence": "Assessment alerting requires recorded approval and satisfied identity, history and actionability conditions; model proposals and known test labels are not approval.",
      "spec_line": 100
    },
    {
      "id": "D6-011",
      "sentence": "Under this owner approval, adopt the existing source-based firm scheduled-to MDQ percentage, constraint-segment and named-zone annotations as binding checks only for their annotated cases.",
      "spec_line": 101
    },
    {
      "id": "D6-012",
      "sentence": "Adopt unchanged-operational-body supersede checks only when the prior is complete and differences are confined to revision metadata or whitespace.",
      "spec_line": 102
    },
    {
      "id": "D6-013",
      "sentence": "Before applying binding scope, verify that included annotations have traceable source support; unsupported annotations remain unapproved or not evaluated and must be listed.",
      "spec_line": 103
    },
    {
      "id": "D6-014",
      "sentence": "This approval does not mean the owner personally audited each annotation.",
      "spec_line": 104
    },
    {
      "id": "D6-015",
      "sentence": "Neither oracle certifies unannotated fields, absolute curtailed volume or real material revisions.",
      "spec_line": 105
    },
    {
      "id": "D6-016",
      "sentence": "Apply the approved scope in new identified runs; old exploratory conclusions keep their original governance and must not be recertified retrospectively.",
      "spec_line": 106
    }
  ],
  "input_time_line": 475
}
