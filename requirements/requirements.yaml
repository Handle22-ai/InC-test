  "policy_decision": "spec.md#spec-ownership-and-decisions",
  "policies": {
    "D1": "Within the bounded NGPL assessment, identify a notice version by pipeline, notice ID and source-content hash.\nIdentify an event by pipeline and the root notice ID of its complete, acyclic, explicit prior-notice chain.\nDo not infer identity from ID order, subject or text similarity.\nAn incomplete chain or disputed cross-chain identity blocks automatic alerting, but not retention of the input or an explicitly uncertain candidate for review; retain any human-approved correlation and its evidence.\nInitial alerts per resolved event must not exceed PARAM-INITIAL-001.\nIdentify a material update by that event and its distinct source notice version.\nIdentical replay or same-source re-extraction must not create another alert revision.\nPersist each alert key, decision reference, delivery attempt and acknowledgement across restarts.\nRetry with the same key; unconfirmed delivery stays uncertain.\nRequire receiver idempotency before claiming duplicate-free delivery.\nRetain this memory without automatic expiry throughout the assessment; production retention requires separate approval.",
    "D2": "Compare a revision to its explicit predecessor using source-grounded constraints, services/directions, restriction kind/value/unit, operational status, effective interval and operational assertions in the body.\nIgnore IDs, links, capture/scrape metadata and whitespace-only presentation changes for materiality.\nIf operational facts are unchanged, classify the supersede as nonmaterial and issue no new alert.\nOther changes require a recorded MATERIAL, NONMATERIAL or UNRESOLVED decision under D6; a changed number alone is not a materiality threshold.\nIf a resolved event has no prior initial-alert record or attempt, its first MATERIAL and actionable decision may create the initial alert under D1.\nIf an initial-alert record exists, a qualifying material revision produces a linked update.\nAn unacknowledged initial attempt reuses its existing key; replay must not create another initial alert.\nUNRESOLVED changes are REVIEW_REQUIRED.\nA lift/termination must compare the prior restriction; do not generalize one rule from the two labeled termination examples.\nFor the bounded same-ID/different-source-content case, retain the conflicting capture as evidence, preserve the last accepted snapshot, and require review before changed content can authorize alerting.\nDo not automatically overwrite, merge, discard or reconcile the conflict.\nAutomatic reconciliation remains outside the implemented storage scope; this specified refusal boundary does not establish a complete source-version service.",
    "D3": "Record source event/publication times with stated timezone, ingestion time, and an explicitly supplied timezone-aware UTC reference time for each decision.\nAmbiguous time meaning remains unknown; do not substitute the machine/model clock.\nMissing ancestors, cycles or conflicting successor ordering defer alerting and retain the gap.\nWhen history arrives, create a new reconciliation decision following explicit prior links; retain the original uncertain decision.\nFor the same accepted source versions, normalized facts, reference time and approved adjudications, the final event view must be order-independent.\nDo not expect independently regenerated stochastic model outputs to be identical.\nActual delivery attempts remain historical and use D1 keys; final-view order independence does not imply identical real-time delivery histories.\nA restriction ending at or before the reference time is historical-only for a new disruption alert.\nCurrent or future intervals may be actionable after D6; assume no arbitrary age or advance-notice cutoff.\nUnknown time bounds and point changes such as a lift require a human actionability decision at that reference time.\nHistorical label evaluation stays separate: never rescore it against today or treat it as permission for stale delivery.\nA source-grounded operational disruption may classify as SIGNAL_CANDIDATE even when its source timestamp timezone is unresolved. Unknown source timezone does not veto BR-FIRM classification; its candidate-only scope and all other evidence/history/refusal rules remain unchanged.\nUnresolved source timezone remains explicitly UNKNOWN and prohibits automatic current/future actionability and recommendation authorization; the actionability/authorization boundary returns REVIEW_REQUIRED even if a caller supplies authorization. recommendation_allowed remains false. The normalized time_basis value UNRESOLVED represents this unknown meaning; UTC fields for unzoned timestamps stay null and the actionability record explicitly reports source_timezone_status UNKNOWN.\nNo NGPL timezone, UTC conversion, lateness cutoff or desk SLA is inferred.\nWhere the source timestamp has an explicit trusted timezone, normal current/future/historical evaluation may proceed. Resolved historical-only intervals and clock-dependent revision/actionability decisions retain time precedence. Classification alone never grants materiality approval, recommendation authorization or delivery permission.",
    "D4": "Give every decision an immutable identity.\nRetrieve by that identity the exact input bytes/hash, extracted facts, prior versions and missing-history observations available then, reference/ingestion times, outcome/reasons, human adjudications, spec/rule/code/ dependency/model/prompt identities, relevant model execution evidence, and delivery key/attempt/acknowledgement when applicable.\nLater information and corrections create linked decisions without replacing their evidence or presenting later facts as known at an earlier decision.\nPreserve missing-history observations as missingness; do not backfill later facts into an old explanation.\nRetain failed/deferred decisions too.\nDo not automatically prune assessment records or retain credentials.\nProduction retention or redaction needs separate approval.\nCurrent snapshot readback alone is not historical decision evidence.",
    "D5": "Empty, structurally invalid, contradictory or unsupported input must yield an explicit uncertain/error disposition, reason code and retained input evidence, not a successful negative classification or alert.\nValidation failure leaves the last valid snapshot unchanged.\nInvalid input or unresolved contradictions use UNKNOWN with a distinguishing reason; model/provider, environment and harness failures retain their separate existing classifications.\nMissing an optional strong-signal field alone is not malformed input.\nConflicting identity, impossible quantities and incompatible operational assertions require correction/review, not fabricated facts.\nUnresolved timestamp meaning requires REVIEW_REQUIRED at the actionability/authorization boundary under D3. It does not by itself block a source-grounded firm-disruption candidate; malformed timestamps and other invalid evidence retain their existing refusal rules.\nA corrected execution is a new linked decision; retain the failed attempt.\nClassification is unscorable only where the necessary semantic result is unavailable.\nStructural, persistence, uncertainty and failure-handling requirements remain evaluable when their required observations exist.\nApplication dispositions are distinct from harness PASS/FAIL/ERROR/UNKNOWN statuses and execution-domain classifications.\nA successful API response with an unusable verdict must not silently become a valid negative or small-impact decision.",
    "D6": "For new assessment cases outside the frozen label oracle, require a named human's recorded MATERIAL/NONMATERIAL/UNRESOLVED adjudication with cited source evidence.\nMATERIAL must identify a meaningful expected effect on gas flow or regional prices; NONMATERIAL must explain routine/administrative content or why a capacity change is minor.\nUnsupported judgement is UNRESOLVED and withholds an alert.\nModels may propose facts/reasons but may not approve this adjudication.\nCritical/unplanned status, planned material impact, segment, quantity and geography are evidence to weigh, not a mandatory all-fields checklist or numeric score cutoff.\nExtract stated values with units and meaning; absent values stay unknown.\nDo not convert scheduled-to MDQ percentages into absolute curtailed volume without the required source capacity/basis.\nKeep the fixed 14 labels as an evaluation oracle only.\nLabels do not authorize runtime alerts and must not be supplied as the implementation's answer to classification.\nAssessment alerting requires recorded approval and satisfied identity, history and actionability conditions; model proposals and known test labels are not approval.\nUnder this owner approval, adopt the existing source-based firm scheduled-to MDQ percentage, constraint-segment and named-zone annotations as binding checks only for their annotated cases.\nAdopt unchanged-operational-body supersede checks only when the prior is complete and differences are confined to revision metadata or whitespace.\nBefore applying binding scope, verify that included annotations have traceable source support; unsupported annotations remain unapproved or not evaluated and must be listed.\nThis approval does not mean the owner personally audited each annotation.\nNeither oracle certifies unannotated fields, absolute curtailed volume or real material revisions.\nApply the approved scope in new identified runs; old exploratory conclusions keep their original governance and must not be recertified retrospectively."
  },
