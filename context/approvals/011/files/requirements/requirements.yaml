requirements:
- id: INPUT-001
  title: Input identity
  statement: Preserve the input notice identity and the content used for a decision.
  rationale: Decisions must refer to the actual notice.
  severity: critical
  preconditions: A readable notice with an explicit identity.
  expected: Output ID equals input ID; original input hash is retained.
  forbidden: Silent identity substitution.
  evidence:
  - case input and hash
  - observed output/state
  - check result and requirement ID
  mode: deterministic
  governance: grounded
  source: spec.md
  basis: inherited/design.md; challenge v5; exact existing contract retained
  validation:
    type: contract
    check: identity
    gate: 1
    params: {}
  policy_id: assessment-v3-owner-20260928
  approval: existing-contract
  enforcement: binding
  decisions: []
  implementation_status: implemented_bounded
  check_status: executable_scoped
  demonstrated_evidence: evidence/coverage.md (per-policy evidence; approval does not establish behavior)
- id: INPUT-002
  title: Invalid input
  statement: Invalid or contradictory input must have an explicit uncertain/error disposition, retained
    evidence and preservation of the last valid snapshot.
  rationale: Prevent fabricated actionable facts.
  severity: critical
  preconditions: Invalid, empty, contradictory or unsupported input.
  expected: 'Apply D5: retain input and reason; prohibit a successful negative or alert from invalidity;
    preserve valid state. Evaluate each requirement where its observations exist.'
  forbidden: Silent valid-negative/small-impact fallback, fabricated facts or loss of the last valid snapshot.
  evidence:
  - case input and hash
  - observed output/state
  - check result and requirement ID
  mode: deterministic
  governance: assessment-assumption
  source: spec.md
  basis: "Challenge v5 pp. 2, 4\u20135: broad lifecycle/refusal/evidence obligations; exact bounded behavior\
    \ is an owner-approved assessment assumption under ADR 006."
  validation:
    type: contract
    check: deferred
    gate: 1
    params: {}
  policy_id: assessment-v3-owner-20260928
  approval: owner-approved
  enforcement: binding
  decisions:
  - D5
  implementation_status: partial
  check_status: not_available
  demonstrated_evidence: evidence/coverage.md (per-policy evidence; approval does not establish behavior)
- id: OUTPUT-001
  title: Decision contract
  statement: Every successful decision exposes identity, binary signal classification, bounded numeric
    confidence, reasons, and extraction collections.
  rationale: Consumers need a stable observable contract.
  severity: critical
  preconditions: Successful processing.
  expected: Finite confidence in [0,1], binary signal, nonempty reasons, lists for locations and restrictions.
  forbidden: Missing fields, NaN, infinity or out-of-range confidence.
  evidence:
  - case input and hash
  - observed output/state
  - check result and requirement ID
  mode: deterministic
  governance: grounded
  source: spec.md
  basis: inherited/design.md; challenge v5; exact existing contract retained
  validation:
    type: contract
    check: decision_shape
    gate: 1
    params:
      confidence_min: 0
      confidence_max: 1
  policy_id: assessment-v3-owner-20260928
  approval: owner-approved
  enforcement: binding
  decisions:
  - D5
  implementation_status: implemented_bounded
  check_status: executable_scoped
  demonstrated_evidence: evidence/coverage.md (per-policy evidence; approval does not establish behavior)
- id: OUTPUT-002
  title: Quantities and units
  statement: Numeric restrictions must be finite and nonnegative, carry a unit, and distinguish scheduled-to
    percent MDQ from volume reduction.
  rationale: Wrong quantities invert trading meaning.
  severity: high
  preconditions: Extracted restriction rows.
  expected: Scheduled-to percent MDQ in [0,100]; a nonnumeric unavailability restriction may have null
    value/unit.
  forbidden: Interpreting 55% scheduled as 55% reduction or imposing [0,100] on hourly entitlement percentages.
  evidence:
  - case input and hash
  - observed output/state
  - check result and requirement ID
  mode: deterministic
  governance: grounded
  source: spec.md
  basis: inherited/design.md; challenge v5; exact existing contract retained
