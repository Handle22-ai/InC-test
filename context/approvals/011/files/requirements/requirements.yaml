- id: STATE-004
  title: Nonmaterial supersedes
  statement: A superseding notice with unchanged operational content must not generate another signal.
  rationale: Suppress routine revision noise.
  severity: high
  preconditions: A complete prior chain; source-supported unchanged operational content with only revision
    metadata or whitespace changes.
  expected: Classify the verified synthetic unchanged-body and repeated revision cases as non-signals;
    under D2/D6, withhold another alert for unchanged operational facts.
  forbidden: A new signal solely because identity/metadata changed; extrapolation to material updates
    or proof of delivered-alert deduplication.
  evidence:
  - case input and hash
  - observed output/state
  - check result and requirement ID
  mode: deterministic
  governance: assessment-assumption
  source: spec.md
  basis: "Challenge v5 pp. 2, 4\u20135: broad lifecycle/refusal/evidence obligations; exact bounded behavior\
