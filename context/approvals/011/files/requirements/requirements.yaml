  title: Durable state
  statement: Successfully processed notices and their child records must survive database close and reopen.
  rationale: Restart must not lose evidence.
  severity: critical
  preconditions: An acknowledged database insertion.
  expected: Reopened rows equal saved state; current notice exists.
  forbidden: Success with lost or absent rows.
  evidence:
