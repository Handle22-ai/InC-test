- id: HISTORY-004
  title: Late notices
  statement: Late-notice actionability must use explicit source-time semantics and a supplied reference
    clock, separate from historical label scoring.
  rationale: Historical relevance differs from current actionability.
  severity: high
  preconditions: A decision about current alerting, including late notices and unresolved point changes.
  expected: 'Apply D3/D6: record source/publication/ingestion times and timezone-aware UTC reference time.
    Ended restrictions are historical-only for new disruption alerts; unresolved times/lifts require human
    actionability review.'
  forbidden: Implicit machine/model clock, invented age cutoff, rescoring historical labels against today
    or treating known labels as alert permission.
  evidence:
  - case input and hash
  - observed output/state
  - check result and requirement ID
  mode: deterministic
  governance: assessment-assumption
  source: spec.md
