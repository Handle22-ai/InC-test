- id: STATE-005
  title: Material revisions
  statement: Material revisions require explicit adjudication and linked initial/update decisions while
    preserving source conflicts for review.
  rationale: Do not hide changed operational risk.
  severity: high
  preconditions: A revision changes operational facts, or an existing notice ID arrives with different
    source content.
  expected: 'Apply D2: distinguish first initial alert, linked update and unacknowledged retry. Retain
    conflicting captures, preserve the last accepted snapshot and require review before changed content
    authorizes alerts.'
  forbidden: Unconditional supersede suppression; a second initial alert after an existing attempt; automatic
    overwrite, merge, discard or reconciliation of source conflicts.
  evidence:
  - case input and hash
  - observed output/state
  - check result and requirement ID
  mode: deterministic
  governance: assessment-assumption
  source: spec.md
  basis: "Challenge v5 pp. 2, 4\u20135: broad lifecycle/refusal/evidence obligations; exact bounded behavior\
