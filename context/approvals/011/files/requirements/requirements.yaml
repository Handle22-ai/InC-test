- id: HISTORY-003
  title: Out-of-order processing
  statement: Out-of-order arrivals must reconcile to an order-independent final view under fixed accepted
    evidence.
  rationale: Arrival order is not event chronology.
  severity: high
  preconditions: The same accepted source versions, normalized facts, reference time and approved adjudications,
    processed in different orders.
  expected: 'Apply D3: create linked reconciliation decisions, preserve earlier uncertainty and historical
    delivery attempts; compare final views using fixed facts.'
  forbidden: Using ID sort as chronology; demanding identical stochastic regeneration or identical real-time
    delivery histories.
