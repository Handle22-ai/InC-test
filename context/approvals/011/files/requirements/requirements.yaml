  title: Execution failures are not behavior
  statement: Provider, environment, harness and unknown failures must not be reported as valid behavioral
    decisions.
  rationale: A fallback can conceal an invalid baseline.
  severity: critical
  preconditions: Every execution.
  expected: Separate execution-domain failures from application dispositions and harness verdicts. An
    unusable model verdict cannot become a valid negative/small-impact result. Classification is unscorable
    only without its semantic result; other observable requirements remain evaluable.
  forbidden: PASS from a mock, silent fallback, invalid helper verdict or credential failure; blanket
    exclusion of independently observable structure/state/failure handling.
