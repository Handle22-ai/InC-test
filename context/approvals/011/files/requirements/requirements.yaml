policies:
  D1: Within the bounded NGPL assessment, identify a notice version by pipeline, notice ID and source-content
    hash. Identify an event by pipeline and the root notice ID of its complete, acyclic, explicit prior-notice
    chain. Do not infer identity from ID order, subject or text similarity. An incomplete chain or disputed
    cross-chain identity blocks automatic alerting, but not retention of the input or an explicitly uncertain
    candidate for review; retain any human-approved correlation and its evidence. Issue at most one initial
    alert per resolved event. Identify a material update by that event and its distinct source notice
    version. Identical replay or same-source re-extraction must not create another alert revision. Persist
    each alert key, decision reference, delivery attempt and acknowledgement across restarts. Retry with
    the same key; unconfirmed delivery stays uncertain. Require receiver idempotency before claiming duplicate-free
    delivery. Retain this memory without automatic expiry throughout the assessment; production retention
    requires separate approval.
  D2: Compare a revision to its explicit predecessor using source-grounded constraints, services/directions,
    restriction kind/value/unit, operational status, effective interval and operational assertions in
    the body. Ignore IDs, links, capture/scrape metadata and whitespace-only presentation changes for
    materiality. If operational facts are unchanged, classify the supersede as nonmaterial and issue no
    new alert. Other changes require a recorded MATERIAL, NONMATERIAL or UNRESOLVED decision under D6;
    a changed number alone is not a materiality threshold. If a resolved event has no prior initial-alert
    record or attempt, its first MATERIAL and actionable decision may create the initial alert under D1.
    If an initial-alert record exists, a qualifying material revision produces a linked update. An unacknowledged
    initial attempt reuses its existing key; replay must not create another initial alert. UNRESOLVED
    changes are REVIEW_REQUIRED. A lift/termination must compare the prior restriction; do not generalize
    one rule from the two labeled termination examples. For the bounded same-ID/different-source-content
    case, retain the conflicting capture as evidence, preserve the last accepted snapshot, and require
    review before changed content can authorize alerting. Do not automatically overwrite, merge, discard
    or reconcile the conflict. Automatic reconciliation remains outside the implemented storage scope;
    this specified refusal boundary does not establish a complete source-version service.
  D3: 'Record source event/publication times with stated timezone, ingestion time, and an explicitly supplied
    timezone-aware UTC reference time for each decision. Ambiguous time meaning remains unknown; do not
    substitute the machine/model clock. Missing ancestors, cycles or conflicting successor ordering defer
    alerting and retain the gap. When history arrives, create a new reconciliation decision following
    explicit prior links; retain the original uncertain decision. For the same accepted source versions,
    normalized facts, reference time and approved adjudications, the final event view must be order-independent.
    Do not expect independently regenerated stochastic model outputs to be identical. Actual delivery
    attempts remain historical and use D1 keys; final-view order independence does not imply identical
    real-time delivery histories. A restriction ending at or before the reference time is historical-only
    for a new disruption alert. Current or future intervals may be actionable after D6; assume no arbitrary
    age or advance-notice cutoff. Unknown time bounds and point changes such as a lift require a human
    actionability decision at that reference time. Historical label evaluation stays separate: never rescore
    it against today or treat it as permission for stale delivery. For bounded proposal classification,
    a source-grounded operational firm-service disruption may be SIGNAL_CANDIDATE when the source timestamp
    lacks a trusted timezone. Unresolved source timezone remains explicit and prohibits automatic current/future
    actionability and recommendation authorization; the actionability/authorization boundary returns REVIEW_REQUIRED.
    recommendation_allowed remains false. No NGPL timezone, UTC conversion, lateness cutoff or desk SLA
    is inferred. Resolved historical-only intervals and clock-dependent revision/actionability decisions
    retain time precedence.'
  D4: Give every decision an immutable identity. Retrieve by that identity the exact input bytes/hash,
    extracted facts, prior versions and missing-history observations available then, reference/ingestion
    times, outcome/reasons, human adjudications, spec/rule/code/ dependency/model/prompt identities, relevant
    model execution evidence, and delivery key/attempt/acknowledgement when applicable. Later information
    and corrections create linked decisions without replacing their evidence or presenting later facts
    as known at an earlier decision. Preserve missing-history observations as missingness; do not backfill
    later facts into an old explanation. Retain failed/deferred decisions too. Do not automatically prune
    assessment records or retain credentials. Production retention or redaction needs separate approval.
    Current snapshot readback alone is not historical decision evidence.
  D5: Empty, structurally invalid, contradictory or unsupported input must yield an explicit uncertain/error
    disposition, reason code and retained input evidence, not a successful negative classification or
    alert. Validation failure leaves the last valid snapshot unchanged. Invalid input or unresolved contradictions
    use UNKNOWN with a distinguishing reason; model/provider, environment and harness failures retain
    their separate existing classifications. Missing an optional strong-signal field alone is not malformed
    input. Conflicting identity, impossible quantities and incompatible operational assertions require
    correction/review, not fabricated facts. Unresolved timestamp meaning requires review at the actionability/authorization
    boundary; it does not alone prohibit a source-grounded firm-service candidate under D3. A corrected
    execution is a new linked decision; retain the failed attempt. Classification is unscorable only where
    the necessary semantic result is unavailable. Structural, persistence, uncertainty and failure-handling
    requirements remain evaluable when their required observations exist. Application dispositions are
    distinct from harness PASS/FAIL/ERROR/UNKNOWN statuses and execution-domain classifications. A successful
    API response with an unusable verdict must not silently become a valid negative or small-impact decision.
  D6: For new assessment cases outside the frozen label oracle, require a named human's recorded MATERIAL/NONMATERIAL/UNRESOLVED
    adjudication with cited source evidence. MATERIAL must identify a meaningful expected effect on gas
    flow or regional prices; NONMATERIAL must explain routine/administrative content or why a capacity
    change is minor. Unsupported judgement is UNRESOLVED and withholds an alert. Models may propose facts/reasons
    but may not approve this adjudication. Critical/unplanned status, planned material impact, segment,
    quantity and geography are evidence to weigh, not a mandatory all-fields checklist or numeric score
    cutoff. Extract stated values with units and meaning; absent values stay unknown. Do not convert scheduled-to
    MDQ percentages into absolute curtailed volume without the required source capacity/basis. Keep the
    fixed 14 labels as an evaluation oracle only. Labels do not authorize runtime alerts and must not
    be supplied as the implementation's answer to classification. Assessment alerting requires recorded
    approval and satisfied identity, history and actionability conditions; model proposals and known test
    labels are not approval. Under this owner approval, adopt the existing source-based firm scheduled-to
    MDQ percentage, constraint-segment and named-zone annotations as binding checks only for their annotated
    cases. Adopt unchanged-operational-body supersede checks only when the prior is complete and differences
    are confined to revision metadata or whitespace. Before applying binding scope, verify that included
    annotations have traceable source support; unsupported annotations remain unapproved or not evaluated
    and must be listed. This approval does not mean the owner personally audited each annotation. Neither
    oracle certifies unannotated fields, absolute curtailed volume or real material revisions. Apply the
    approved scope in new identified runs; old exploratory conclusions keep their original governance
    and must not be recertified retrospectively.
