- id: HISTORY-002
  title: Missing prior notices
  statement: Missing or disputed prior history must block automatic alerting while preserving the input,
    gap and uncertain candidate.
  rationale: Do not hide context gaps.
  severity: high
  preconditions: An ancestor is missing or a chain is disputed, cyclic or conflicting.
