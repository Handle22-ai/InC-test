- id: SIGNAL-004
  title: Termination and prior context
  statement: Evaluate lifting a prior material restriction using available prior context and preserve
    case-specific termination labels.
  rationale: A lift can matter as much as onset.
  severity: high
  preconditions: A lift or termination with its explicit prior restriction and available source evidence.
  expected: Compare prior operational context; do not always suppress or always inherit signal classification.
    Unresolved materiality/history requires review; frozen examples remain evaluation-only.
  forbidden: A generic policy inferred from two conflicting-looking examples without human clarification.
  evidence:
  - case input and hash
  - observed output/state
  - check result and requirement ID
