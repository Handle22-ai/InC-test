- id: STATE-003
  title: Already emitted signals
  statement: Automatic alerting must use the approved event identity, persistent alert keys and acknowledgement
    contract.
  rationale: Duplicate trading actions create risk.
  severity: critical
  preconditions: A candidate for automatic alerting, including initial, update, replay and retry decisions.
  expected: 'Apply D1, D2 and D6: resolve the explicit chain and approval/actionability conditions; persist
    attempts and acknowledgements; reuse unacknowledged keys; retain uncertain candidates without automatic
    alerting.'
  forbidden: Using classification labels or storage receipts as delivery approval; duplicate initial alerts
    or unsupported duplicate-free delivery claims.
  evidence:
  - case input and hash
  - observed output/state
  - check result and requirement ID
  mode: deterministic
  governance: assessment-assumption
  source: spec.md
  basis: "Challenge v5 pp. 2, 4\u20135: broad lifecycle/refusal/evidence obligations; exact bounded behavior\
