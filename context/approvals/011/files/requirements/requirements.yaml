- id: OUTPUT-003
  title: Restriction location linkage
  statement: Each extracted restriction must reference a location belonging to the same notice.
  rationale: Prevents assignment to the wrong constraint.
  severity: high
  preconditions: Extracted rows.
  expected: Unique location indexes and valid restriction-to-location joins.
  forbidden: Orphan restrictions or cross-notice joins.
