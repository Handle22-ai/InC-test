- id: STATE-002
  title: Idempotent stored observations
  statement: Reprocessing identical notice content must not accumulate duplicate stored location or restriction
    observations.
  rationale: Repeated scraping must not multiply state.
  severity: critical
  preconditions: Same notice processed repeatedly, including after restart.
  expected: Child rows per notice reflect the current extraction once; notice row is unique.
  forbidden: Duplicate child rows or multiple versions without explicit version identity.
  evidence:
  - case input and hash
  - observed output/state
  - check result and requirement ID
