- id: HISTORY-005
  title: Historical explainability
  statement: Past decisions must be retrievable by immutable identity with exactly the context available
    at decision time.
  rationale: Mutable state alone cannot explain past decisions.
  severity: high
  preconditions: A past successful, failed or deferred decision, including after later corrections or
    revisions.
  expected: 'Apply D4: retain and retrieve input, prior versions/missingness, clocks, facts, reasons,
    adjudications, implementation/policy/model identities and applicable delivery records. Later information
    creates linked decisions.'
  forbidden: Backfilling later facts into old explanations, replacing earlier evidence, automatic assessment
    pruning, credential retention or claiming a complete service from current snapshots.
  evidence:
  - case input and hash
  - observed output/state
  - check result and requirement ID
  mode: deterministic
  governance: assessment-assumption
  source: spec.md
  basis: "Challenge v5 pp. 2, 4\u20135: broad lifecycle/refusal/evidence obligations; exact bounded behavior\
