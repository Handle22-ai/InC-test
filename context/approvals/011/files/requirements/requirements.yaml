- id: SIGNAL-001
  title: Trading relevance and labeled evaluation
  statement: Classify notices from source-supported operational effects on gas flow or regional prices;
    routine, administrative and minor changes are not signals, and insufficient evidence remains unresolved.
  rationale: Makes baseline behavior independently assessable.
  severity: critical
  preconditions: Accepted source facts and sufficient semantic evidence; frozen labels apply only to their
    separate historical evaluation.
  expected: Apply the supported behavioral contract without label lookup; report the frozen 14-case evaluation
    separately, including disagreements and unscorable cases. Labels never authorize runtime recommendations.
  forbidden: Relabeling examples to match implementation or treating execution failures as negatives.
  evidence:
  - case input and hash
  - observed output/state
  - check result and requirement ID
  mode: evaluative
  governance: grounded
  source: spec.md
  basis: inherited/design.md; challenge v5; exact existing contract retained
