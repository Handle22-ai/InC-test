- id: SIGNAL-002
  title: Routine and administrative control
  statement: Routine administrative, IT and plan-index notices without operational flow restrictions must
    not signal.
  rationale: Avoid false trading signals from routine postings.
  severity: critical
  preconditions: Routine administrative, IT or plan-index source content without an operational flow restriction.
  expected: No signal for routine content without operational restriction; supplied selected examples
    remain evaluation data.
  forbidden: Outage or maintenance words alone create a signal.
  evidence:
  - case input and hash
  - observed output/state
  - check result and requirement ID
  mode: evaluative
