- id: SIGNAL-003
  title: Critical disruption recall
  statement: Detect the labeled unplanned force-majeure disruption.
  rationale: Missing unplanned flow disruption is a high-risk outcome.
  severity: critical
  preconditions: A source-supported material critical or unplanned operational disruption with sufficient
    semantic evidence.
  expected: Retain supported disruption candidates; typical signal characteristics are evidence, not an
    all-fields checklist. Frozen critical-case recall is a separate scoped evaluation.
  forbidden: Silent missed critical disruption.
  evidence:
  - case input and hash
