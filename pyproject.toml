[project]
name = "incommodities-take-home"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[tool.ruff]
target-version = "py314"
line-length = 100
include = ["classifier.py", "harness/**/*.py", "rebuilt/**/*.py", "submission/**/*.py", "tests/**/*.py"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.14"
files = ["classifier.py", "harness", "rebuilt", "submission", "tests"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# These unchanged modules are imported from inherited/ at the adapter boundary.
# They have no stubs and are deliberately outside the new-code quality scope.
module = ["database", "llm_utils", "notice_parser", "notice_validator"]
ignore_missing_imports = true
